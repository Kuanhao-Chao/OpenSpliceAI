{% set name = "openspliceai" %}
{% set version = "0.1.0.dev0" %}

# Local development recipe: build the current checkout with conda-build.
# The published Bioconda recipe is maintained separately. For a release, replace
# source.path with the uploaded sdist URL and its verified SHA-256.

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ../

build:
  noarch: python
  number: 0
  run_exports:
    - {{ pin_subpackage("openspliceai", max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.9
    # NumPy-2 ABI floors match setup.py. Wheel compatibility is platform-specific.
    # numpy removed `np.long` in 1.24 and re-added it in 2.0, so 1.24-1.26 is a
    # gap where a numpy-2-era dependency reading `np.long` crashes on import
    # (GitHub issue #19). Keep the whole stack on one side of that gap.
    - pytorch >=2.3.0
    - numpy >=2.0.0
    - pandas >=2.2.2
    - h5py >=3.11.0
    - tqdm >=4.65.2
    - scikit-learn >=1.4.2
    - scipy >=1.13.0
    - biopython >=1.83
    - matplotlib-base >=3.8.4
    - psutil >=5.9.2
    - pysam >=0.22.0
    - pyfaidx >=0.8.1.1
    - gffutils >=0.12
    - mappy >=2.28

test:
  imports:
    - openspliceai
    - openspliceai.openspliceai
  commands:
    - openspliceai --help

about:
  home: https://github.com/Kuanhao-Chao/OpenSpliceAI
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: Deep learning framework that decodes splicing across species
  doc_url: https://khchao.com/OpenSpliceAI/
  dev_url: https://github.com/Kuanhao-Chao/OpenSpliceAI

extra:
  recipe-maintainers:
    - Kuanhao-Chao
  identifiers:
    - doi:10.7554/eLife.107454
