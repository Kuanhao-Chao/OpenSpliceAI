name: Docs

# Builds the Sphinx documentation in docs/ and publishes it to GitHub Pages at
# https://kuanhao-chao.github.io/OpenSpliceAI/
#
# Pull requests get the build as a check; only pushes to main publish.
# Pages must be enabled once, under Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/genome_browser/**'
      - '.github/workflows/docs.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/genome_browser/**'
      - '.github/workflows/docs.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/genome-browser/package-lock.json

      - name: Install browser dependencies and run core unit tests
        working-directory: docs/genome-browser
        run: |
          npm ci
          npm test

      - name: Verify every published snapshot file
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.genome_browser.hosting import verify
          for manifest in sorted(Path('docs/genome-browser/public').glob('**/manifest.json')):
              print(verify(manifest.parent))
          PY

      - name: Build documentation (warnings are errors)
        run: make -C docs html SPHINXOPTS="-W"

      - name: Check that every local link and asset resolves
        # Sphinx does not validate URLs written by hand inside `.. raw:: html` blocks or in
        # _templates/*.html, and the docs rely on both, so -W alone is not enough.
        run: python docs/check_links.py docs/build/html

      - name: Test production browser core workflows
        working-directory: docs/genome-browser
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/release-report.json
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run audit -- --reporter=line,json

      - name: Preserve core browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genome-browser-core
          path: docs/genome-browser/test-results

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    # Queue deployments rather than cancelling one midway through.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
