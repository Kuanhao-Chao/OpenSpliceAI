name: Docs

# Builds the Sphinx documentation in docs/ and publishes it to GitHub Pages at
# https://kuanhao-chao.github.io/OpenSpliceAI/
#
# Pull requests get the build as a check; only pushes to main publish.
# Pages must be enabled once, under Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/genome_browser/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/genome_browser/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/genome-browser/package-lock.json

      - name: Install and test genome browser
        working-directory: docs/genome-browser
        run: |
          npm ci
          npm test
          npx playwright install --with-deps chromium firefox webkit
          npm run audit

      - name: Test browser data preparation
        run: |
          pip install -r tools/genome_browser/requirements.txt
          OMP_NUM_THREADS=2 python -m unittest discover -s tools/genome_browser/tests -v

      - name: Preserve browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genome-browser-audit
          path: docs/genome-browser/test-results

      - name: Build documentation (warnings are errors)
        run: make -C docs html SPHINXOPTS="-W"

      - name: Check that every local link and asset resolves
        # Sphinx does not validate URLs written by hand inside `.. raw:: html` blocks or in
        # _templates/*.html, and the docs rely on both, so -W alone is not enough.
        run: python docs/check_links.py docs/build/html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    # Queue deployments rather than cancelling one midway through.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
