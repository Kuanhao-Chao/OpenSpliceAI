name: Software verification
on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9', torch: 'torch==2.4.1'}
          - {os: ubuntu-latest, python: '3.10', torch: 'torch==2.4.1'}
          - {os: ubuntu-latest, python: '3.11', torch: 'torch==2.4.1'}
          - {os: ubuntu-latest, python: '3.12', torch: 'torch==2.4.1'}
          - {os: ubuntu-latest, python: '3.13', torch: torch}
          - {os: ubuntu-latest, python: '3.14', torch: torch}
          - {os: macos-14, python: '3.11', torch: torch}
          - {os: macos-14, python: '3.14', torch: torch}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install compatible scientific stack
        shell: bash
        run: |
          if [[ '${{ runner.os }}' == Linux ]]; then
            python -m pip install '${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
          else
            # setup-python provides universal2 Python on Apple Silicon. mappy
            # selects SIMD headers for one native architecture, so compiling
            # both slices together fails. Build dependencies for this runner.
            export ARCHFLAGS="-arch arm64"
            python -m pip install '${{ matrix.torch }}'
          fi
          python -m pip install -e '.[dev]'
          python -m pip check
      - run: make lint test
  full-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' build
          python -m pip check
      - name: Complete CPU suite and separate coverage gates
        run: |
          CUDA_VISIBLE_DEVICES='' OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MPLBACKEND=Agg python -m pytest -m 'not keras and not gpu' --cov=openspliceai --cov-branch --cov-report=json:coverage.json --cov-report=xml --junitxml=test-results.xml -q
          python ci/check_coverage.py coverage.json
      - name: Run documented six-command tutorial
        run: python examples/tutorial/run.py --output-dir /tmp/osai-tutorial
      - name: Build and test both distributions away from source
        run: |
          python -m build
          python -m venv --system-site-packages /tmp/osai-wheel
          /tmp/osai-wheel/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/osai-wheel/bin/python "$GITHUB_WORKSPACE/ci/smoke_distribution.py" --expected-prefix /tmp/osai-wheel
          python -m venv --system-site-packages /tmp/osai-sdist
          /tmp/osai-sdist/bin/python -m pip install --no-deps --no-build-isolation "$GITHUB_WORKSPACE"/dist/*.tar.gz
          /tmp/osai-sdist/bin/python "$GITHUB_WORKSPACE/ci/smoke_distribution.py" --expected-prefix /tmp/osai-sdist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-validation
          path: |
            test-results.xml
            coverage.json
            coverage.xml
            dist/
            /tmp/osai-tutorial/summary.json
            /tmp/osai-tutorial/commands.json
  minimum-scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' -c ci/minimum-scientific.constraints
          python -m pip check
      - run: make test-cpu
  keras-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' numpy==2.0.2 tensorflow==2.18.0 tf-keras==2.18.0 spliceai==1.3.1
          python -m pip check
          python ci/prepare_reference_weights.py
      - run: TF_USE_LEGACY_KERAS=1 CUDA_VISIBLE_DEVICES='' OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 TF_NUM_INTRAOP_THREADS=2 TF_NUM_INTEROP_THREADS=1 MPLBACKEND=Agg python ci/required_backend.py keras --output-dir verification/keras
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keras-reference
          path: verification/keras/
