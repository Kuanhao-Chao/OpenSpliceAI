name: Software tests
on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -m pip check
      - run: make lint test
  full-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' build
          python -m pip check
      - name: Full CPU suite and line coverage gate
        run: >-
          CUDA_VISIBLE_DEVICES='' OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MPLBACKEND=Agg
          python -m pytest -m 'not keras and not gpu' --cov=openspliceai
          --cov-report=term-missing --cov-report=xml --cov-fail-under=95 --junitxml=test-results.xml -q
      - name: Build distributions
        run: python -m build
      - name: Install wheel away from source and check entrypoint and package data
        run: |
          python -m venv /tmp/osai-wheel
          /tmp/osai-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/osai-wheel/bin/openspliceai --help
          /tmp/osai-wheel/bin/python -c "from importlib.resources import files; p=files('openspliceai.variant')/'annotations'; assert (p/'grch38.txt').is_file() and (p/'grch37.txt').is_file()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-validation
          path: |
            test-results.xml
            coverage.xml
            dist/
  minimum-scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install representative minimum scientific stack
        run: |
          python -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' -c ci/minimum-scientific.constraints
          python -m pip check
      - run: make test
