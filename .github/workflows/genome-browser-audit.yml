name: Genome browser extended audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/genome_browser/requirements.txt
      - name: Install data preparation dependencies
        run: pip install -r tools/genome_browser/requirements.txt
      - name: Run all data preparation tests
        run: OMP_NUM_THREADS=2 python -m unittest discover -s tools/genome_browser/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/genome-browser/package-lock.json
      - name: Run all frontend unit and browser audits
        working-directory: docs/genome-browser
        run: |
          npm ci
          npm run test:all
          npx playwright install --with-deps chromium firefox webkit
          npm run audit:all
      - name: Preserve extended audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genome-browser-extended
          path: docs/genome-browser/test-results
